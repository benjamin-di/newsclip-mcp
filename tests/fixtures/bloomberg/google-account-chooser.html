<!doctype html>
<html lang="en">
  <head><title>Choose an account</title></head>
  <body>
    <main>
      <h1>Choose an account</h1>
      <ul>
        <li>
          <div role="link" data-identifier="reader@example.com">
            <span>Reader Example</span>
            <span>reader@example.com</span>
          </div>
        </li>
        <li>
          <div role="link" data-identifier="other@example.com">
            <span>Other Example</span>
            <span>other@example.com</span>
            <span>Signed out</span>
          </div>
        </li>
        <li>
          <div role="link">Use another account</div>
        </li>
      </ul>
    </main>
  </body>
</html>
