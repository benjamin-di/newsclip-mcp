<!doctype html>
<!--
  NYT's second login step: the mirror of email_step.html, with the address now
  shown as a read-only decoy and the password live.

  Unlike the email step, this shape is MODELLED rather than measured — reaching
  it means putting a real address into NYT's auth flow. It follows the
  contemporaneous description in the fix that this replaces: "the address is
  still shown in a visible but READ-ONLY field". If that ever proves wrong and
  the address is editable here, the flow runs the username step a second time,
  which is a retry rather than a skipped step.
-->
<html lang="en">
  <head><title>Enter password</title></head>
  <body>
    <main>
      <form action="/auth/login" method="post">
        <label>Email address
          <input id="email-decoy" name="email" type="email" autocomplete="username"
                 value="reader@example.com" readonly>
        </label>
        <label>Password
          <input id="password" name="password" type="password"
                 autocomplete="current-password">
        </label>
        <button id="submit-password" type="submit">Log in</button>
      </form>
    </main>
  </body>
</html>
