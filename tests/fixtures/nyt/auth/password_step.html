<!doctype html>
<!--
  A synthetic password step with a visible, read-only email decoy.
  The editable password control selects the password step. A variant with an
  editable email control instead represents a retry of the email step.
-->
<html lang="en">
  <head><title>Enter password</title></head>
  <body>
    <main>
      <form action="/auth/login" method="post">
        <label>Email address
          <input id="email-decoy" name="email" type="email" autocomplete="username"
                 value="reader@example.com" readonly>
        </label>
        <label>Password
          <input id="password" name="password" type="password"
                 autocomplete="current-password">
        </label>
        <button id="submit-password" type="submit">Log in</button>
      </form>
    </main>
  </body>
</html>
