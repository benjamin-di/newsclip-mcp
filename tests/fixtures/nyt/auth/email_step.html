<!doctype html>
<!--
  A synthetic email step with a visible, enabled, read-only password decoy.
  Step selection must use editability rather than presence or visibility so
  the email control is selected first. The decoy intentionally has neither
  a name nor an autocomplete attribute.
-->
<html lang="en">
  <head><title>Enter email</title></head>
  <body>
    <main>
      <form action="/auth/enter-email" method="post">
        <label>Email address
          <input id="email" name="email" type="email" autocomplete="username">
        </label>
        <input id="password-decoy" type="password" readonly>
        <button id="submit-email" type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
