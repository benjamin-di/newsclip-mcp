name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          done=false
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            done=true
          fi
          echo "done=$done" >> "$GITHUB_OUTPUT"

  ci:
    needs: released
    if: needs.released.outputs.done != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Identify immutable candidates
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          fingerprint="$(uv run --locked --no-dev python scripts/print_source_fingerprint.py)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate=candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build standalone server candidate
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/newsclip-mcp:${{ steps.version.outputs.candidate }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            BUILD_SOURCE_FINGERPRINT=${{ steps.version.outputs.fingerprint }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=newsclip
          cache-to: type=gha,mode=max,scope=newsclip
      - name: Build sign-in browser candidate
        id: login
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: login
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/newsclip-login-browser:${{ steps.version.outputs.candidate }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            BUILD_SOURCE_FINGERPRINT=${{ steps.version.outputs.fingerprint }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=newsclip
          cache-to: type=gha,mode=max,scope=newsclip
      - name: Exercise shipped images without external network access
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/newsclip-mcp@${{ steps.server.outputs.digest }}
          LOGIN_IMAGE: ghcr.io/${{ github.repository_owner }}/newsclip-login-browser@${{ steps.login.outputs.digest }}
          VCS_REF: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in "$SERVER_IMAGE" "$LOGIN_IMAGE"; do
            docker pull "$image"
            docker image inspect "$image" | jq -e \
              --arg revision "$VCS_REF" --arg source "$SOURCE_URL" --arg version "$VERSION" \
              '.[0].Config.Labels | .["org.opencontainers.image.revision"] == $revision and
                .["org.opencontainers.image.source"] == $source and
                .["org.opencontainers.image.version"] == $version' >/dev/null \
              || { echo "ERROR: candidate OCI source, revision or version does not match this release" >&2; exit 1; }
          done
          pocket_id="$RUNNER_TEMP/newsclip-pocket-id"
          curl --fail --silent --show-error --location \
            https://github.com/pocket-id/pocket-id/releases/download/v2.19.1/pocket-id_linux_amd64 -o "$pocket_id"
          printf '%s  %s\n' fbe58b3af6e225600136c7da033810d2d86436fbd13a135fa52205f467544436 "$pocket_id" \
            | sha256sum --check --status
          chmod 755 "$pocket_id"
          docker run --rm --init --network none --read-only --tmpfs /tmp:rw,exec,mode=1777,size=1g \
            -v "$PWD/scripts/smoke_standalone.py:/acceptance.py:ro" \
            --entrypoint python "$SERVER_IMAGE" /acceptance.py
          timeout 120 docker run --rm --init --network none --read-only --tmpfs /tmp:rw,exec,mode=1777,size=1g --shm-size=256m \
            -v "$PWD/scripts/smoke_browser_isolation.py:/acceptance.py:ro" \
            --entrypoint python "$SERVER_IMAGE" /acceptance.py
          timeout 300 docker run --rm --init --network none --read-only --tmpfs /tmp:rw,exec,mode=1777,size=1g --shm-size=256m \
            -v "$pocket_id:/pocket-id:ro" -e POCKET_ID_BIN=/pocket-id \
            -v "$PWD/scripts/pocket_id_acceptance.py:/pocket_id_acceptance.py:ro" \
            -v "$PWD/scripts/standalone_e2e.py:/acceptance.py:ro" \
            --entrypoint python "$LOGIN_IMAGE" /acceptance.py
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/*
          retention-days: 7
      - name: Promote tested digests
        if: github.ref_type == 'tag'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          LOGIN_DIGEST: ${{ steps.login.outputs.digest }}
        run: |
          bash scripts/promote_image.sh "$REGISTRY/newsclip-mcp" "$SERVER_DIGEST" "$VERSION"
          bash scripts/promote_image.sh "$REGISTRY/newsclip-login-browser" "$LOGIN_DIGEST" "$VERSION"
          docker buildx imagetools create --prefer-index=false --tag "$REGISTRY/newsclip-mcp:latest" "$REGISTRY/newsclip-mcp@$SERVER_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$REGISTRY/newsclip-login-browser:latest" "$REGISTRY/newsclip-login-browser@$LOGIN_DIGEST"

  github-release:
    needs: images
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  pypi:
    needs: [released, github-release]
    if: >-
      always() && vars.PYPI_PUBLISH == 'true' && github.ref_type == 'tag' &&
      (needs.github-release.result == 'success' || needs.released.outputs.done == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Download and verify the tested public release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$version"
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > release.json
          gh release download "$TAG" --repo "$REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          python3 scripts/check_release_distributions.py release.json dist "$version"
          uv tool run --from twine twine check --strict dist/*
          uv run --no-project --with "./dist/newsclip-$version-py3-none-any.whl" newsclip --version
      - name: Publish with short-lived identity and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
          skip-existing: true
