name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          done=false
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            done=true
          fi
          echo "done=$done" >> "$GITHUB_OUTPUT"

  ci:
    needs: released
    if: needs.released.outputs.done != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Identify immutable candidates
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate=candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build standalone server candidate
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/newsclip-mcp:${{ steps.version.outputs.candidate }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=newsclip
          cache-to: type=gha,mode=max,scope=newsclip
      - name: Build sign-in browser candidate
        id: login
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: login
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/newsclip-login-browser:${{ steps.version.outputs.candidate }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=newsclip
          cache-to: type=gha,mode=max,scope=newsclip
      - name: Exercise shipped images without external network access
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/newsclip-mcp@${{ steps.server.outputs.digest }}
          LOGIN_IMAGE: ghcr.io/${{ github.repository_owner }}/newsclip-login-browser@${{ steps.login.outputs.digest }}
        run: |
          docker pull "$SERVER_IMAGE"
          docker pull "$LOGIN_IMAGE"
          docker run --rm --init --network none --read-only --tmpfs /tmp:rw,exec,mode=1777,size=1g \
            -v "$PWD/scripts/smoke_standalone.py:/acceptance.py:ro" \
            --entrypoint python "$SERVER_IMAGE" /acceptance.py
          timeout 300 docker run --rm --init --network none --read-only --tmpfs /tmp:rw,exec,mode=1777,size=1g --shm-size=256m \
            -v "$PWD/scripts/standalone_e2e.py:/acceptance.py:ro" \
            --entrypoint python "$LOGIN_IMAGE" /acceptance.py
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/*
          retention-days: 7
      - name: Promote tested digests
        if: github.ref_type == 'tag'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          LOGIN_DIGEST: ${{ steps.login.outputs.digest }}
        run: |
          bash scripts/promote_image.sh "$REGISTRY/newsclip-mcp" "$SERVER_DIGEST" "$VERSION"
          bash scripts/promote_image.sh "$REGISTRY/newsclip-login-browser" "$LOGIN_DIGEST" "$VERSION"
          docker buildx imagetools create --prefer-index=false --tag "$REGISTRY/newsclip-mcp:latest" "$REGISTRY/newsclip-mcp@$SERVER_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$REGISTRY/newsclip-login-browser:latest" "$REGISTRY/newsclip-login-browser@$LOGIN_DIGEST"

  github-release:
    needs: images
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
