[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newsclip"
version = "2.0.3"
description = "News search, verified subscription reading and private archiving"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "benjamin-di"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.4,<9",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
local = [
  "curl-cffi>=0.16.3,<1",
  "lxml>=5,<7",
  "patchright>=1.52,<2",
  "trafilatura>=2,<3",
  "signin-window[automation,oidc]>=0.7.1,<0.8",
  "account-connections==0.1.1",
  # Security minima are part of the local wheel contract, not only the uv lock.
  "authlib>=1.9.1",
  "joserfc>=1.7.6",
  "dnspython>=2.9.0",
]
# Compatibility alias; use local for the complete acquisition runtime.
login = []
signin = ["uvicorn>=0.34,<1"]
mcp = [
    "anyio>=4.8,<5",
    # FastMCP 4 (MCP SDK 2): the SDK's own mcp.server.fastmcp is gone in v2.
    "fastmcp>=4.1.2,<5",
    "fastmcp-slim>=4.1.2,<5",
    "authlib>=1.9.1",
    "joserfc>=1.7.6",
    "dnspython>=2.9.0",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/benjamin-di/newsclip-mcp"
Documentation = "https://github.com/benjamin-di/newsclip-mcp#readme"
Issues = "https://github.com/benjamin-di/newsclip-mcp/issues"

[project.scripts]
newsclip = "newsclip.entrypoint:run"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]
transport-lab = [
  "playwright>=1.61,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newsclip"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
# bench/ holds the provider-neutral transport probe; `bench` imports from the root.
testpaths = ["tests", "bench"]
pythonpath = ["."]
markers = [
  "live: requires credentials and real provider network access",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "newsclip.runtime_projection"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
# Security floors for authentication and DNS dependencies in the locked runtime.
constraint-dependencies = [
  "authlib>=1.9.1",
  "joserfc>=1.7.6",
  "dnspython>=2.9.0",
  "fastmcp-slim>=4.1.2",
]
