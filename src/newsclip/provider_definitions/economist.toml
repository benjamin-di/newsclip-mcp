schema_version = 1
key = "economist"
order = 60
enabled_by_default = true

[capabilities]
requires_session_for_retrieve = true
requires_session_for_search = true
session_kind = "cookie"
retrieval_transport = "browser"
# Public search HTML accepts the portable jar over HTTP; browser remains only
# for paid full-article retrieval.
search_transport = "http"

[browser_retrieval]
# Warm path navigates the article directly; recovery rehydrates via homepage
# then a known full article before the requested URL.
warmup_urls = []
recovery_warmup_urls = [
  "https://www.economist.com/",
  "https://www.economist.com/business/2026/07/16/how-sk-hynix-became-the-king-of-advanced-memory-chips",
]
warmup_settle_seconds = 0
article_settle_seconds = 0
network_idle_timeout_seconds = 0
navigation_wait_until = "commit"
ready_selectors = ["article", "h1", "main"]
ready_timeout_seconds = 3

[rate_budget]
# Browser discovery and article save share one token bucket; keep headroom so
# warm retrieval stays under the product latency budget.
requests_per_second = 5.0
burst = 5

[identity]
allowed_hosts = ["economist.com", "www.economist.com"]
canonical_host = "www.economist.com"
path_pattern = "^/(?P<id>(?!api(?:/|$)|search(?:/|$)|user(?:/|$)|subscribe(?:/|$))[a-z0-9-]+/(?P<published>[0-9]{4}/[0-9]{2}/[0-9]{2})/[a-z0-9][a-z0-9-]*)$"
lowercase_groups = ["id"]

[search]
kind = "html"
endpoint = "https://www.economist.com/search"
query_parameter = "q"
result_xpath = ["//main//ol/li//h2/a[@href]", "//main//ol/li//a[@href][ancestor::h2]"]
empty_result_xpath = ["//main//*[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'no results')]", "//main//ol[not(li)]"]
published_date_identity_group = "published"
published_date_format = "%Y/%m/%d"

[check]
query = "Gulf war devastating oil spills more likely"
canonical_url = "https://www.economist.com/middle-east-and-africa/2026/05/28/the-gulf-war-makes-devastating-oil-spills-more-likely"

[assessment]
canonical_signal = "canonical_article_url"
article_xpath = ["//main//article", "//article"]
page_headline_xpath = ["//article//h1[normalize-space()]", "//main//h1[normalize-space()]"]
record_jsonld_state = true
required_signals = ["article_body_structure", "markdown_body", "extracted_headline"]
metadata_alternatives = [["newsarticle_jsonld", "jsonld_headline"], ["jsonld_absent", "page_headline"], ["jsonld_non_article", "page_headline"]]
minimum_words = 250

[assessment.paragraph_floor]
root_xpath = "//article"
paragraph_xpath = ".//p"
preferred_root_xpath = ".//h1[normalize-space()]"
minimum_count = 4
minimum_substantial_count = 2
substantial_minimum_characters = 80

[[assessment.negative_rules]]
kind = "challenge"
xpath_any = [
  "//*[@id='px-captcha']",
  "//*[@data-visible-challenge='true']",
  "//iframe[contains(@src, 'captcha-delivery')]",
  "//html[.//p[@id='cmsg' and normalize-space()='Please enable JS and disable any ad blocker'] and .//script[@src='https://ct.captcha-delivery.com/i.js'] and not(.//article)]",
  "//html[head/title[normalize-space()='Just a moment...'] and .//*[@id='challenge-error-text'] and .//script[contains(., '/cdn-cgi/challenge-platform/')]]",
]
text_any = ["verify you are human", "are you a robot", "press and hold"]

[[assessment.negative_rules]]
kind = "authentication"
final_url_hosts = ["myaccount.economist.com"]
final_url_path_prefixes = ["/api/auth/login"]
xpath_any = ["//form[.//input[@type='password']]"]

[[assessment.negative_rules]]
kind = "paywall"
xpath_any = ["//teg-inline-wall", "//*[@data-testid='paywall']", "//*[@data-subscription-required]"]

[session]
candidate_verification_mode = "browser_paid_probe"
allowed_origins = ["https://www.economist.com", "https://economist.com", "https://myaccount.economist.com"]
allowed_cookie_domains = ["economist.com"]
verification_minimum_words = 250
default_verification_url = "https://www.economist.com/business/2026/07/16/how-sk-hynix-became-the-king-of-advanced-memory-chips"

[auth]
login_url = "https://www.economist.com/api/auth/login"

[auth.launch]
locale = "en-GB"
timezone_id = "Europe/London"
accept_language = "en-GB,en;q=0.9"

[auth.controls]
username = ["input[name='username']", "input[type='email']", "input[autocomplete='username']", "lightning-input input[type='email']"]
password = ["input[type='password']", "input[autocomplete='current-password']", "lightning-input input[type='password']"]
submit = ["c-lwc-login-form lightning-button button", "button[type='submit']", "lightning-button button"]
consent = ["#onetrust-accept-btn-handler", "button:text-is(\"Accept All\")"]

[auth.observations.username_visible]
any_selectors = ["input[name='username']", "input[type='email']", "input[autocomplete='username']"]

[auth.observations.password_visible]
any_selectors = ["input[type='password']", "input[autocomplete='current-password']"]

[auth.observations.second_factor]
any_selectors = ["input[autocomplete='one-time-code']", "input[name='verificationCode']", "input[name='code']"]

[auth.observations.credential_rejected]
any_text = ["incorrect email or password", "invalid email or password", "couldn't log you in", "could not log you in"]

[auth.observations.account_alert]
any_text = ["account has been locked", "account is locked", "account has been suspended", "contact customer support"]

[auth.observations.authenticated]
required_hosts = ["www.economist.com", "economist.com"]
excluded_path_prefixes = ["/api/auth/login"]
absent_selectors = ["input[name='username']", "input[type='email']", "input[autocomplete='username']", "input[type='password']", "input[autocomplete='current-password']"]
