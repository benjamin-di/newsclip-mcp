schema_version = 1
key = "guardian"
order = 80
enabled_by_default = true

[capabilities]
requires_session_for_retrieve = false
requires_session_for_search = false
session_kind = "none"
retrieval_transport = "http"
search_transport = "http"

[rate_budget]
requests_per_second = 5.0
burst = 5

[identity]
allowed_hosts = ["theguardian.com", "www.theguardian.com"]
canonical_host = "www.theguardian.com"
# The month segment is alphabetic (/2026/jun/11/), never numeric.
path_pattern = "^/(?P<id>[a-z0-9-]+(?:/[a-z0-9-]+)*/[0-9]{4}/[a-z]{3}/[0-9]{2}/[a-z0-9][a-z0-9-]*)$"
canonical_path = "/{id}"
lowercase_groups = ["id"]

# GuardianProvider serves search and article bodies entirely from the Open
# Platform API - the publisher's licensed channel; theguardian.com is never
# scraped (robots policy verified 2026-07-28). The key reference is
# resolved lazily and attached as a host-scoped request header so the
# credential can never reach a URL or the archive.
[search]
kind = "adapter"
endpoint = "https://content.guardianapis.com/search"

[check]
query = "ECB eurozone interest rates Iran war inflation"
canonical_url = "https://www.theguardian.com/business/2026/jun/11/ecb-eurozone-interest-rates-iran-war-inflation"

[assessment]
canonical_signal = "canonical_article_url"
article_xpath = ["//article"]
required_signals = ["newsarticle_jsonld", "jsonld_headline", "article_body_structure", "markdown_body", "extracted_headline"]
# Deliberately empty: the API returns a JSON status, not a challenge page.
# Drift fails closed in the provider's schema validation.
negative_rules = []
